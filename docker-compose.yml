services:
  portfolio:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.gridy.kr/portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      # [호스트 포트]:[컨테이너 포트]
      # 온프레미스 서버에서 다른 웹 서비스나 리버스 프록시(Nginx, NPM, Caddy 등)와 충돌하지 않도록
      # 필요에 따라 앞의 '8080' 포트를 원하는 포트(예: 3000, 80 등)로 변경할 수 있습니다.
      - "9000:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 온프레미스에서 Nginx Proxy Manager나 Traefik 등 외부 공유 네트워크를 사용하는 경우:
    # networks:
    #   - proxy-network

    # networks:
    #   proxy-network:
    #     external: true
